name: Feature request
description: Suggest an enhancement for the GCM client libraries
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the use case. Avoid customer-identifying details.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

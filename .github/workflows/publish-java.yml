#
# Publish Java SDKs to GitHub Packages (until Maven Central is configured).
# Trigger: release published, or manual workflow_dispatch.
# Requires GITHUB_TOKEN (default) with packages:write on this repository.

name: Publish Java to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: bindings/java
            java: "11"
          - module: bindings/java-jackson2
            java: "11"
          - module: bindings/java-jackson3
            java: "17"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Install core SDK (for jackson modules)
        if: matrix.module != 'bindings/java'
        working-directory: bindings/java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -q -DskipTests install

      - name: Deploy
        working-directory: ${{ matrix.module }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -q -DskipTests deploy

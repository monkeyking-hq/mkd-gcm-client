#
# Publish Java artifacts to Maven Central (Sonatype Central Publisher Portal).
#
# Secrets (repository or org):
#   CENTRAL_TOKEN_USERNAME  — Portal user token name
#   CENTRAL_TOKEN_PASSWORD  — Portal user token password
#   GPG_PRIVATE_KEY         — armored private key
#   GPG_PASSPHRASE          — key passphrase
#
# Manual: workflow_dispatch. Also runs on published GitHub Releases.

name: Publish Java to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      auto_publish:
        description: "Auto-publish after Central validation (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  publish:
    name: Deploy to Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Deploy (profile central)
        working-directory: bindings
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          AUTOPUB="${{ github.event.inputs.auto_publish || 'false' }}"
          mvn -B clean deploy -Pcentral \
            -Dcentral.autoPublish="${AUTOPUB}" \
            -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}"

[package]
name = "mkd-gcm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mkd-gcm"
readme = "../../README.md"
description = "Golden Circlet Memory (GCM) network client — GroupPath and memory store for remote mkd-gcm-server"
keywords = ["gcm", "memory", "nntp", "client", "monkeyking"]
categories = ["network-programming", "api-bindings"]

[features]
default = []
# Migration-only wing/room → group path oracle. Not enabled by default.
locator-migrate = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3.10"

[[test]]
name = "memory_nntp_integration"
path = "../../tests/memory_nntp_integration.rs"
